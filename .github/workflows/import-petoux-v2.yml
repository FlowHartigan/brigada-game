name: Import PETOUX v2 assets

on:
  push:
    branches:
      - feat/petoux-v2-integration
    paths:
      - .github/workflows/import-petoux-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/petoux-v2-integration

      - name: Download prepared PETOUX v2 pack
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprnortheu.oaiusercontent.com/files/00000000-ba94-81f4-b115-eae91ee7fefb/raw?se=2026-09-16T05%3A23%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=4c03dcc9-f3fd-53ed-998f-2371311d6547&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T03%3A23%3A17Z&ske=2026-09-17T03%3A23%3A17Z&sks=b&skv=2026-02-06&sig=j5%2B1NcbNV7ubOcE9OlVuoiKiumlLobQzYPcxRxHBl/M%3D' \
            --output /tmp/petoux-v2-ready.zip

      - name: Install PETOUX v2 PNGs
        run: |
          rm -rf /tmp/petoux-v2
          mkdir -p /tmp/petoux-v2 public/fighters/petoux-v2
          unzip -q /tmp/petoux-v2-ready.zip -d /tmp/petoux-v2
          cp /tmp/petoux-v2/petoux-v2/*.png public/fighters/petoux-v2/

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              'front.png', 'idle.png', 'attack1.png', 'attack2.png', 'attack3.png',
              'defend.png', 'dodge.png', 'hit.png', 'stunned.png', 'special.png',
              'win.png', 'portrait.png',
          }
          root = Path('public/fighters/petoux-v2')
          actual = {p.name for p in root.glob('*.png')}
          if actual != expected:
              raise SystemExit(f'Unexpected asset set: {sorted(actual)}')

          for path in sorted(root.glob('*.png')):
              with Image.open(path) as image:
                  if image.size != (448, 416):
                      raise SystemExit(f'{path}: unexpected size {image.size}')
                  if image.mode != 'RGBA':
                      image = image.convert('RGBA')
                  alpha = image.getchannel('A')
                  extrema = alpha.getextrema()
                  if extrema[0] != 0 or extrema[1] < 250:
                      raise SystemExit(f'{path}: invalid transparency {extrema}')
          PY

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fighters/petoux-v2
          if git diff --cached --quiet; then
            echo "PETOUX v2 assets already imported"
            exit 0
          fi
          git commit -m "feat(petoux): add v2 fighter PNG assets"
          git push origin HEAD:feat/petoux-v2-integration
