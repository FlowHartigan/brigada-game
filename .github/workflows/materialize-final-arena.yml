name: Materialize final arena asset

on:
  push:
    branches:
      - feat/final-combat-arena-background
    paths:
      - .asset-import/final-arena/**

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and verify exact uploaded JPEG
        shell: bash
        run: |
          set -euo pipefail
          READY=.asset-import/final-arena/READY
          if [[ ! -f "$READY" ]]; then
            echo "Arena fragments are not complete yet; nothing to do."
            exit 0
          fi

          mkdir -p public/backgrounds
          cat .asset-import/final-arena/part-*.b64 | base64 --decode > public/backgrounds/brigada-combat-arena-final.jpeg

          echo "e4f811350d6cfa9b57b827e47c14b514079d7130705231846c5c44b6087bb396  public/backgrounds/brigada-combat-arena-final.jpeg" | sha256sum --check --strict
          test "$(wc -c < public/backgrounds/brigada-combat-arena-final.jpeg)" -eq 515579

          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/backgrounds/brigada-combat-arena-final.jpeg')
          data = p.read_bytes()
          if data[:2] != b'\xff\xd8' or data[-2:] != b'\xff\xd9':
              raise SystemExit('Invalid JPEG SOI/EOI markers')
          i = 2
          sof = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
          width = height = None
          while i < len(data):
              if data[i] != 0xFF:
                  i += 1
                  continue
              while i < len(data) and data[i] == 0xFF:
                  i += 1
              if i >= len(data): break
              marker = data[i]
              i += 1
              if marker in (0xD8, 0xD9) or 0xD0 <= marker <= 0xD7:
                  continue
              if i + 2 > len(data): break
              length = int.from_bytes(data[i:i+2], 'big')
              if length < 2 or i + length > len(data):
                  raise SystemExit('Invalid JPEG segment length')
              if marker in sof:
                  height = int.from_bytes(data[i+3:i+5], 'big')
                  width = int.from_bytes(data[i+5:i+7], 'big')
                  break
              i += length
          if (width, height) != (1536, 864):
              raise SystemExit(f'Unexpected JPEG dimensions: {width}x{height}')
          print(f'JPEG verified: {width}x{height}, {len(data)} bytes')
          PY

      - name: Commit exact binary asset and remove transport fragments
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .asset-import/final-arena/READY ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .asset-import/final-arena
          git add public/backgrounds/brigada-combat-arena-final.jpeg
          git commit -m "feat: add exact final combat arena image"
          git push
