name: Prototype CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Source-size guard
        run: npm run check:source-size

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit generated lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/reproducible-dependencies'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock npm dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mobile browser QA
        run: npm run test:e2e

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fighter-visual-qa
          path: test-results/visual-*.png
          if-no-files-found: warn
          retention-days: 7
