name: Materialize final arena v2

on:
  push:
    branches:
      - feat/final-combat-arena-background-v2
    paths:
      - .asset-import/final-arena/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify exact JPEG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/backgrounds
          cat .asset-import/final-arena/part-*.b64 | base64 --decode > public/backgrounds/brigada-combat-arena-final.jpeg
          echo "e4f811350d6cfa9b57b827e47c14b514079d7130705231846c5c44b6087bb396  public/backgrounds/brigada-combat-arena-final.jpeg" | sha256sum --check --strict
          test "$(wc -c < public/backgrounds/brigada-combat-arena-final.jpeg)" -eq 515579
          python3 - <<'PY'
          from pathlib import Path
          data = Path('public/backgrounds/brigada-combat-arena-final.jpeg').read_bytes()
          if data[:2] != b'\xff\xd8' or data[-2:] != b'\xff\xd9':
              raise SystemExit('Invalid JPEG markers')
          i = 2
          sof = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
          wh = None
          while i + 3 < len(data):
              if data[i] != 0xFF:
                  i += 1
                  continue
              while i < len(data) and data[i] == 0xFF: i += 1
              if i >= len(data): break
              marker = data[i]; i += 1
              if marker in (0xD8,0xD9) or 0xD0 <= marker <= 0xD7: continue
              length = int.from_bytes(data[i:i+2], 'big')
              if length < 2 or i + length > len(data): raise SystemExit('Invalid JPEG segment')
              if marker in sof:
                  h = int.from_bytes(data[i+3:i+5], 'big')
                  w = int.from_bytes(data[i+5:i+7], 'big')
                  wh = (w,h); break
              i += length
          if wh != (1536,864): raise SystemExit(f'Unexpected JPEG dimensions: {wh}')
          print('Verified exact JPEG:', wh, len(data))
          PY

      - name: Commit binary asset and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .asset-import/final-arena .github/workflows/materialize-final-arena-v2.yml
          git add public/backgrounds/brigada-combat-arena-final.jpeg
          git commit -m "feat: add exact final combat arena image"
          git push
