name: Materialize NEXMOS v2 assets

on:
  push:
    branches:
      - feat/nexmos-v2
    paths:
      - .github/workflows/materialize-nexmos-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/nexmos-v2
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Download lossless source pack
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-5858-81fb-8ac3-edcd213a7d06/raw?se=2026-09-16T16%3A30%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=a7cd701e-984a-58eb-b2c4-34ebf4bc9c03&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T06%3A03%3A26Z&ske=2026-09-17T06%3A03%3A26Z&sks=b&skv=2026-02-06&sig=zE3iT%2BFVBo3ajmOWo/Fxn4UjqWGoMQXrRTiwEShq1DA%3D' \
            -o /tmp/nexmos-pack.webp
          test "$(stat -c%s /tmp/nexmos-pack.webp)" -eq 700246

      - name: Extract and validate PNG frames
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          names = [
              "front", "idle", "attack1", "attack2", "attack3", "defend",
              "dodge", "hit", "stunned", "special", "win", "portrait",
          ]
          expected_bounds = {
              "front": (129, 32, 319, 396),
              "idle": (117, 56, 330, 396),
              "attack1": (119, 79, 329, 396),
              "attack2": (108, 47, 339, 396),
              "attack3": (112, 51, 335, 396),
              "defend": (120, 54, 327, 396),
              "dodge": (120, 154, 327, 396),
              "hit": (126, 54, 322, 396),
              "stunned": (138, 84, 310, 396),
              "special": (91, 73, 356, 396),
              "win": (123, 28, 324, 396),
              "portrait": (103, 14, 345, 396),
          }
          source = Image.open("/tmp/nexmos-pack.webp")
          assert getattr(source, "n_frames", 1) == len(names), source.n_frames
          target = Path("public/fighters/nexmos-v2")
          target.mkdir(parents=True, exist_ok=True)

          for index, name in enumerate(names):
              source.seek(index)
              frame = source.convert("RGBA")
              assert frame.size == (448, 416), (name, frame.size)
              alpha = frame.getchannel("A")
              bbox = alpha.getbbox()
              assert bbox == expected_bounds[name], (name, bbox, expected_bounds[name])
              extrema = alpha.getextrema()
              assert extrema[0] == 0 and extrema[1] == 255, (name, extrema)
              frame.save(target / f"{name}.png", format="PNG", optimize=True, compress_level=9)

          generated = sorted(path.name for path in target.glob("*.png"))
          assert generated == sorted(f"{name}.png" for name in names), generated
          PY

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fighters/nexmos-v2
          git diff --cached --check
          git commit -m "feat: add NEXMOS v2 sprite assets"
          git push origin HEAD:feat/nexmos-v2
